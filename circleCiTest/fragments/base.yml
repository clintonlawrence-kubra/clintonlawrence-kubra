parameters:
  component_name:
    type: string
    default: sample-service
  owning_team:
    type: string
    default: platform
  github_org:
    type: string
    default: kubra-platform
  repo_visibility:
    type: string
    default: private
  repo_suffixes:
    type: string
    default: app,infra,docs
  include_github_repos:
    type: boolean
    default: true
  include_sonarqube:
    type: boolean
    default: true

executors:
  go-executor:
    docker:
      - image: cimg/go:1.22

commands:
  setup-go-tools:
    steps:
      - checkout
      - restore_cache:
          keys:
            - go-mod-v1-{{ checksum "go.sum" }}
            - go-mod-v1-
      - run: go mod download
      - save_cache:
          key: go-mod-v1-{{ checksum "go.sum" }}
          paths:
            - ~/go/pkg/mod

jobs: {}
workflows: {}